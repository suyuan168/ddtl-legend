<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打到天亮 · Logo 源文件</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:1rem;background:#171622;color:#fff;font:1rem system-ui,sans-serif}
  canvas{max-width:80vw;max-height:72vh;object-fit:contain}
  a{color:inherit}
</style>
<main></main>
<a hidden download="dawn-logo.png">导出透明 PNG</a>
<script type="module">
  import {drawWordmark} from './wordmark.js';
  const canvas=await drawWordmark();
  document.querySelector('main').append(canvas);
  const link=document.querySelector('a');
  link.href=canvas.toDataURL('image/png');
  link.hidden=false;
</script>
</html>
