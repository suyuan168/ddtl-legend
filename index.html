<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#272136">
  <title>打到天亮</title>
  <link rel="icon" href="assets/brand/sun.webp" type="image/webp">
  <link rel="stylesheet" href="game/entry.css">
  <script type="module" src="game/launch.js"></script>
</head>
<body>
  <div id="dawn" class="dawn">
    <canvas class="dawn-art" aria-hidden="true"></canvas>
    <main id="home" class="dawn-home">
      <h1><img class="dawn-logo" src="assets/brand/dawn-logo.png" width="838" height="688" alt="打到天亮" fetchpriority="high"></h1>
      <nav class="dawn-actions" aria-label="主菜单">
        <button id="enter" class="dawn-start"><span class="arrow" aria-hidden="true"></span><span data-label="play">开始游戏</span></button>
        <div class="dawn-minor"><button id="preferences" data-label="settings">设置</button><i aria-hidden="true"></i><button id="exit" data-label="quit">退出</button></div>
      </nav>
    </main>
    <div id="load" role="status" class="dawn-load" hidden>
      <div class="dawn-meter-card"><div class="dawn-meter-line"><span id="load-label">正在载入</span><span id="load-number"></span></div>
        <div id="load-meter" class="dawn-meter" role="progressbar" aria-label="载入进度"><i></i></div>
        <button type="button" id="load-retry" hidden>重新加载</button>
      </div>
    </div>
    <dialog id="entry-dialog" class="dawn-dialog" aria-labelledby="dialog-title">
      <form method="dialog"><button class="dawn-close" aria-label="关闭">×</button></form>
      <h2 id="dialog-title"></h2>
      <section id="volume-panel">
        <label><span data-label="master">总音量</span><input type="range" min="0" max="100" id="volume-master"><output for="volume-master"></output></label>
        <label><span data-label="music">音乐</span><input type="range" min="0" max="100" id="volume-music"><output for="volume-music"></output></label>
        <label><span data-label="sfx">音效</span><input type="range" min="0" max="100" id="volume-sfx"><output for="volume-sfx"></output></label>
        <label><span data-label="mute">静音</span><input id="muted" type="checkbox"></label>
        <label><span data-label="tips">玩法提示</span><input id="tips" type="checkbox"></label>
        <label><span data-label="language">语言</span><select id="entry-language"><option value="zh-cn">简体中文</option><option value="zh-tw">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label>
      </section>
      <section id="exit-panel" hidden><button id="leave" class="dawn-start" data-label="leave">退出游戏</button><button id="stay" data-label="back">返回</button></section>
    </dialog>
    <div id="rest" class="dawn-rest" hidden><h2 data-label="ended">已退出游戏</h2><button id="restart" class="dawn-start" data-label="returnHome">返回标题</button></div>
  </div>
  <template id="game-shell">
<main id="stage" aria-label="打到天亮 游戏画面"></main>

<dialog id="original-dialog"><div class="unity-stage"></div></dialog>
<div id="waiting-ui" class="unity-stage" hidden></div>
<div id="battle-ui" class="unity-stage" hidden></div><dialog id="equipment" aria-label="Equipment"><div class="unity-stage"></div></dialog>
<div id="chat-bubbles" aria-live="polite" class="unity-stage"></div><div id="chat-input" class="unity-stage" hidden></div>
<div id="hud" hidden><span id="place"></span><span id="ink"></span><span id="roomHud" hidden></span><button id="controls">菜单 · Esc</button></div>
<div id="touch" hidden><div id="stick">移动</div><button id="fire">射击</button></div>
<dialog id="menu"><form method="dialog"><button class="close" aria-label="关闭">×</button></form><h1>打到天亮</h1><div id="tabs"><button data-tab="room">房间</button><button data-tab="map">场景</button><button data-tab="weapon">武器</button><button data-tab="costume">装扮</button><button data-tab="catalog">全装扮</button><button data-tab="help">操作</button></div><div id="options"></div><footer><button id="music">音乐</button><a href="library.html">素材与数据 ↗</a></footer></dialog>
  </template>
</body>
</html>
